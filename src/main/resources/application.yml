server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_idle?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: "CampusIdleJwtSecretCampusIdleJwtSecret123456"
    expiration-seconds: 86400
    issuer: "campus-idle-backend"
  upload-dir: uploads

logging:
  level:
    org.springframework.security: info
